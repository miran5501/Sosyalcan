# SosyalCan Docker kurulumu. İki kullanım:
#
# 1) Tam kurulum (uygulama + PostgreSQL + Redis, tek komut):
#      kökte .env dosyası hazırla (kurulum.ps1 / kurulum.sh otomatik üretir) ve:
#      docker compose --profile app up -d --build
#    Uygulama: http://localhost:3000 (APP_PORT ile değiştirilebilir)
#
# 2) Yerel geliştirme: yalnızca Redis (PostgreSQL bilgisayarda kurulu, uygulama `npm run dev` ile çalışır):
#      docker compose up -d
#
# Durdurmak: docker compose --profile app down   (veriler volume'larda kalır; silmek için ayrıca -v)

services:
  redis:
    image: redis:7-alpine
    container_name: sosyalcan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    profiles: ["app"]
    image: postgres:17-alpine
    container_name: sosyalcan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sosyalcan
      POSTGRES_USER: sosyalcan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sosyalcan -d sosyalcan"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Açılışta bir kez: migration'lar + (ilk kurulumda) ilk Admin. Bitince kapanır; web bunu bekler.
  setup:
    profiles: ["app"]
    build:
      context: ./apps/web
      target: builder
    image: sosyalcan-web-builder
    command: ["sh", "docker/setup.sh"]
    environment: &app-env
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      DATABASE_URL: postgresql://sosyalcan:${POSTGRES_PASSWORD}@db:5432/sosyalcan?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Yönetici}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
      target: runner
    image: sosyalcan-web
    container_name: sosyalcan-web
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads # dosya ekleri (STORAGE_DRIVER=local)
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  redis-data:
  db-data:
  uploads:
